- name: Copy rpi5 platform fixes
  ansible.builtin.copy:
     src: "{{ item.file }}"
     dest: "{{ item.destination }}"
     owner: stepmania
     group: stepmania
     mode: '0644'
  with_items:
  - file: files/misc/99-rpi5-xorg-fix.conf
    destination: /etc/X11/xorg.conf.d/99-rpi5-xorg-fix.conf
  tags:
  - fixes

- name: Disable not needed systemd units
  ansible.builtin.systemd_service:
    masked: true
    enabled: false
    name: "{{ item }}"
  when: item in ansible_facts.services
  with_items:
  - ModemManager.service
  - bluetooth.service
  - avahi-daemon.service
  - nfs-client.service
  - dphys-swapfile.service
  - userconfig.service
  tags: systemd

- name: Remove not needed files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
  - /etc/ssh/sshd_config.d/rename_user.conf

- name: Disable swap
  ansible.builtin.lineinfile:
    path: "/etc/dphys-swapfile"
    regexp: "^#?CONF_SWAPSIZE="
    line: "CONF_SWAPSIZE=0"
  tags: swap
  ignore_errors: true

- name: Set /tmp in memory
  ansible.builtin.lineinfile:
    path: "/etc/fstab"
    line: "tmpfs /tmp tmpfs defaults,noatime,nosuid,nodev,size=100M 0 0"
  tags: tmpmem

- name: Set /var/log in memory
  ansible.builtin.lineinfile:
    path: "/etc/fstab"
    line: "tmpfs /var/log tmpfs size=40M 0 0"
  tags: tmplogs

- name: Set journal to maximum 10M of logs
  ansible.builtin.lineinfile:
    path: "/etc/systemd/journald.conf"
    regexp: "^#?SystemMaxUse="
    line: "SystemMaxUse=10M"
  tags: tmplogs

- name: Set journal to log to memory
  ansible.builtin.lineinfile:
    path: "/etc/systemd/journald.conf"
    regexp: "^#?Storage="
    line: "Storage=volatile"
  tags: tmplogs

- name: Gather mount facts
  ansible.builtin.setup:
    gather_subset:
    - mounts

  # https://stackoverflow.com/a/25979548
- name: Set rootfs to noatime
  ansible.builtin.mount:
    name: "{{ item.mount }}"
    src: "{{ item.device }}"
    fstype: "{{ item.fstype }}"
    opts: "{{ item.options }},noatime"
    state: present
  with_items: "{{ ansible_mounts }}"
  when: item.mount == "/" and item.options.find(",") >= 0 and item.options.find("noatime") == -1

- name: Set rootfs to nodiratime
  ansible.builtin.mount:
    name: "{{ item.mount }}"
    src: "{{ item.device }}"
    fstype: "{{ item.fstype }}"
    opts: "{{ item.options }},nodiratime"
    state: present
  with_items: "{{ ansible_mounts }}"
  when: item.mount == "/" and item.options.find(",") >= 0 and item.options.find("nodiratime") == -1

- name: Set rootfs to commit=900
  ansible.builtin.mount:
    name: "{{ item.mount }}"
    src: "{{ item.device }}"
    fstype: "{{ item.fstype }}"
    opts: "{{ item.options }},commit=900"
    state: present
  with_items: "{{ ansible_mounts }}"
  when: item.mount == "/" and item.options.find(",") >= 0 and item.options.find("commit=900") == -1

- name: Create .xsession-errors as a symbolic link to /dev/null
  file:
    state: "link"
    src: "/dev/null"
    force: true
    dest: "/home/stepmania/.xsession-errors"

- name: Disable ITGMania log to file
  ansible.builtin.lineinfile:
    path: "/home/stepmania/.itgmania/Save/Preferences.ini"
    regexp: "^LogToDisk"
    line: "LogToDisk=0"
  tags: tmplogs

- name: Delay page cache writeback to reduce SD card wear
  ansible.builtin.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-sdcard-writeback.conf
    state: present
    reload: true
  with_items:
  - { name: vm.dirty_writeback_centisecs, value: '500' }
  - { name: vm.dirty_expire_centisecs, value: '9000' }

# DPI output configuration
- name: Ensure /boot/firmware/dpi-config.txt exists (empty if missing)
  ansible.builtin.copy:
    dest: /boot/firmware/dpi-config.txt
    content: ""
    force: false
    owner: root
    group: root
    mode: '0644'

# Include it even if it is empty
#   this will be changeable over a cockpit plugin
- name: Ensure config.txt includes the DPI mode file
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    line: "include dpi-config.txt"
    insertafter: EOF
    state: present

- name: Fail if dpi_mode is set but not a known mode
  ansible.builtin.fail:
    msg: >-
      rpi_dpi_mode "{{ rpi_dpi_mode }}" is not a valid mode.
      Available modes: {{ rpi.dpi_modes.keys() | list }}
  when: rpi_dpi_mode is defined and rpi_dpi_mode not in rpi.dpi_modes

- name: Write DPI mode config to its own file
  ansible.builtin.copy:
    dest: /boot/firmware/dpi-config.txt
    content: "{{ rpi.dpi_modes[rpi_dpi_mode] }}"
  when: rpi_dpi_mode is defined
